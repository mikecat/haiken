<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>はいけん ～配列を検索するやつ～</title>
		<link rel="icon" href="haiken.ico" sizes="16x16">
		<script src="haiken.js"></script>
	</head>
	<body>
		<h1>はいけん ～配列を検索するやつ～</h1>
		<h2>検索①</h2>
		<p>
			<input type="text" size="30" value="" id="query1">
		</p>
		<p id="result1" style="white-space: pre-wrap;"></p>
		<h2>検索②</h2>
		<p>
			<input type="text" size="30" value="" id="query2">
		</p>
		<p id="result2" style="white-space: pre-wrap;"></p>
		<h2>発見位置マップ</h2>
		<p id="result_map" style="white-space: pre-wrap;"></p>
		<h2>検索対象の配列</h2>
		<p>
			<textarea id="target" rows="10" cols="30"></textarea>
		</p>
		<h2>書き方</h2>
		<ul>
			<li>検索対象の配列は、1行に1個書く</li>
			<li>配列の要素は <code>,</code> で区切る</li>
			<li>要素内で <code>/</code> で区切ると、そのいずれかに一致すれば一致とみなす</li>
			<li>要素 <code>*</code> は、任意の要素と一致する</li>
		</ul>
		<h2>注意事項</h2>
		<ul>
			<li>発見位置マップは、各配列で各クエリと一致した先頭の位置の差を表す</li>
			<li>検索クエリ、および検索対象の配列は LocalStorage に保存される</li>
			<li>一致した検索対象の配列の要素が全て <code>*</code> の場合は、一致を表示しない</li>
		</ul>
		<p style="font-size: 75%; opacity: 0.75;">
			<a href="https://github.com/mikecat/haiken">GitHub リポジトリ</a>
		</p>
	</body>
</html>
